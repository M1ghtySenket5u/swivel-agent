[project]
name = "swivel-agent"
version = "0.1.0"
description = "Mid-scam detection, prevention and voice education for Swivel Transactions users"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "google-genai>=1.0",
    "elevenlabs>=1.50",
    "phonenumbers>=8.13",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]